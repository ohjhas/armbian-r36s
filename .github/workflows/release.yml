name: release Armbian
on:
  workflow_dispatch:
env:
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: write

jobs:
  get_build_date:
    runs-on: ubuntu-latest
    outputs:
      build_datedash: ${{ steps.set_date.outputs.datedash }}
      build_date: ${{ steps.set_date.outputs.date }}
    steps:
      - name: Set build date
        id: set_date
        run: |
          datedash=$(date +%Y-%m-%d-%H%M%S)
          echo "datedash=${datedash}" >> "$GITHUB_OUTPUT"
          echo "date=${datedash//-/}" >> "$GITHUB_OUTPUT"

  build:
    strategy:
      matrix:
        device: [r36s]
        os: [trixie, resolute]
        type: [xfce, minimal]
      fail-fast: false
    runs-on: ubuntu-latest
    needs: get_build_date
    steps:

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - uses: pierotofy/set-swap-space@master
        with:
          swap-space-path: /swapfile
          swap-size-gb: 8
          remove-existing-swap-files: false

      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Prep
        run: |
          set -euo pipefail

          # Ask gh for tag names only (no table parsing), skipping pre-releases/drafts
          LatestArmbianVer=$(gh release list -R armbian/build \
            --exclude-pre-releases --exclude-drafts --limit 30 \
            --json tagName -q '.[].tagName' \
            | grep -v -E "trunk|digest" | head -n1)

          if [ -z "$LatestArmbianVer" ]; then
            echo "::error::Could not determine latest Armbian release tag"
            exit 1
          fi

          LatestArmbianURL="https://github.com/armbian/build/archive/refs/tags/${LatestArmbianVer}.tar.gz"
          echo "Using Armbian ${LatestArmbianVer}"
          echo "LatestArmbianURL=${LatestArmbianURL}"

          wget -q -nv "$LatestArmbianURL" -O "${LatestArmbianVer}.tar.gz"
          tar --strip-components=1 -xf "${LatestArmbianVer}.tar.gz"
          rm -f "${LatestArmbianVer}.tar.gz"
          mkdir -p release

      - name: Build armbian-${{ matrix.device }}-${{ matrix.os }}-${{ matrix.type }}.img
        run: |
          image=${{ matrix.device }}-${{ matrix.os }}-${{ matrix.type }}
          sleep $(( RANDOM % 300 ))
          ./compile.sh "${image}" || exit 1
          find output -name "*.img" -exec cp -vf {} "release/armbian-${image}.img" \;

      - name: Compress armbian-${{ matrix.device }}-${{ matrix.os }}-${{ matrix.type }}.img
        run: |
          find release -name "*.img" -exec xz -vz -T0 -6 --extreme {} \;
          ls release

      - name: Release armbian-${{ matrix.device }}-${{ matrix.os }}-${{ matrix.type }}.img.xz
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.img.xz
          draft: true
          name: build ${{ matrix.device }}-${{ needs.get_build_date.outputs.build_datedash }}
          tag_name: ${{ matrix.device }}-v${{ needs.get_build_date.outputs.build_date }}
